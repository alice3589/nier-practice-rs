[package]
name = "nier-practice-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "NieR:Automata 練習ツール (Practice Table + YASM を Rust で統合)"
license = "MIT"

[dependencies]
eframe = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
zip = { version = "4", default-features = false, features = ["deflate"] }
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
